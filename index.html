<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip Ledger</title>
<meta name="description" content="Tool flipping: profit, board, weeks and the road to $5k.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip Ledger">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card-2:#f2f2f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea;
  --green:#30a14e; --green-soft:#e9f9ee; --red:#ff3b30; --red-soft:#ffe3e0; --amber:#b06e00; --amber-soft:#fff3d6;
  --blue:#0071e3; --kept:#8e8e93;
  --hero:#000; --hero-ink:#fff; --hero-green:#30d158;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --card:#1c1c1e; --card-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#2c2c2e;
  --green:#30d158; --green-soft:#17331f; --red:#ff453a; --red-soft:#3a1d1a; --amber:#ffb340; --amber-soft:#3a2e12;
  --blue:#2997ff; --kept:#8e8e93; --hero:#1c1c1e; --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --card-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#2c2c2e;
  --green:#30d158; --green-soft:#17331f; --red:#ff453a; --red-soft:#3a1d1a; --amber:#ffb340; --amber-soft:#3a2e12;
  --blue:#2997ff; --kept:#8e8e93; --hero:#1c1c1e; --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100svh;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media (min-width:520px){body{background:#0a0a0a}.app{box-shadow:0 0 0 1px #222,0 30px 80px rgba(0,0,0,.6);background:var(--bg)}}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:calc(18px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 30px 30px;position:relative;overflow:clip}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(ellipse at 30% 0%,rgba(48,209,88,.22),transparent 60%);pointer-events:none}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.75}
.hero .top b{font-weight:600;letter-spacing:-.01em}
.hero .theme{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);font-size:14px;display:grid;place-items:center}
.hero .k{font-size:13px;opacity:.6;margin-top:18px}
.hero .v{font-size:64px;font-weight:700;letter-spacing:-.055em;line-height:1;margin:4px 0 6px;color:var(--hero-green)}
.hero .m{font-size:13px;opacity:.7}
.goal{height:6px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:18px;overflow:hidden}
.goal i{display:block;height:100%;width:0;background:var(--hero-green);border-radius:99px;transition:width 1.6s var(--ease)}
.hero .acct{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
.hero .acct small{display:block;font-size:12px;opacity:.6;margin-top:2px}
.hero .acct b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero .acct b.neg{color:#ff6961}
.hero .row{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-top:8px}

/* compact sticky bar */
.bar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  padding:calc(8px + env(safe-area-inset-top)) 20px 0;transform:translateY(-100%);opacity:0;transition:transform .35s var(--ease),opacity .25s;position:fixed;left:0;right:0;max-width:480px;margin:0 auto}
.bar.show{transform:none;opacity:1}
.bar .line{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar .line b{font-size:20px;letter-spacing:-.04em;color:var(--green)}

/* views */
.views{position:relative;overflow:clip;width:100%;padding-top:6px}
.view{display:none;animation:slide .4s var(--ease);min-width:0;width:100%}
.view.on{display:block}
@keyframes slide{from{opacity:0;transform:translateX(var(--dir,24px))}}
.muted{color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;vertical-align:2px;white-space:nowrap}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.est{background:var(--card-2);color:var(--muted)}
.sect{font-size:13px;color:var(--muted);font-weight:600;margin:18px 20px 8px;display:flex;justify-content:space-between}

/* board */
.stages{display:flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px;margin:14px 16px 12px}
.stages button{flex:1;padding:9px 2px;border-radius:11px;font-size:13px;white-space:nowrap;font-weight:600;color:var(--muted);transition:.2s;line-height:1.1}
.stages button em{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
.stages button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stages button.on em{color:var(--green);opacity:1}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.stage-grid .ghost,.stage-grid .more{grid-column:1/-1}
.c{background:var(--card);border-radius:16px;padding:12px;font-size:13px;font-weight:600;line-height:1.3;box-shadow:var(--shadow);position:relative;text-align:left;width:100%;
  transform:translateX(24px);opacity:0;transition:transform .6s var(--ease),opacity .6s}
.in .c{transform:none;opacity:1}
.c:nth-child(2){transition-delay:.05s}.c:nth-child(3){transition-delay:.1s}.c:nth-child(4){transition-delay:.15s}.c:nth-child(5){transition-delay:.2s}.c:nth-child(6){transition-delay:.25s}
.c .nm{padding-right:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c .pr{font-size:21px;letter-spacing:-.04em;margin-top:6px}
.c .pr small{font-size:11px;margin-left:4px;color:var(--green)}
.c .pr small.neg{color:var(--red)}
.c .age{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.c .age.amber{background:var(--amber-soft);color:var(--amber)}
.c .age.red{background:var(--red-soft);color:var(--red)}
.c .age.grey{background:var(--card-2);color:var(--muted)}
.c .paid{position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;color:var(--green);border:2px solid var(--green);padding:1px 5px;border-radius:4px;transform:rotate(-8deg)}
.c.ghost{background:transparent;border:1.5px dashed var(--line);box-shadow:none;color:var(--muted);text-align:center;font-weight:500;padding:16px 12px}
.c.more{background:var(--card-2);box-shadow:none;color:var(--muted);text-align:center;font-weight:600;padding:12px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding:6px 16px 4px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:8px 16px 0}
.kpi{padding:12px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.04em;margin-top:2px}

/* stock tab */
.kpi .k + .v + .k{margin-top:2px}
.srows{display:grid;gap:10px;padding:0 16px}
.srow{display:block;width:100%;text-align:left;padding:14px}
.srow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.srow .nm{font-weight:600;font-size:15px;line-height:1.3}
.srow .age{position:static;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--green-soft);color:var(--green);flex:none}
.srow .age.amber{background:var(--amber-soft);color:var(--amber)}
.srow .age.red{background:var(--red-soft);color:var(--red)}
.srow .age.grey{background:var(--card-2);color:var(--muted)}
.srow .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.srow .prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.srow .prices div{background:var(--card-2);border-radius:12px;padding:8px 10px}
.srow .prices small{display:block;font-size:11px;color:var(--muted)}
.srow .prices b{display:block;font-size:18px;letter-spacing:-.03em;line-height:1.2}
.srow .prices em{display:block;font-style:normal;font-size:11px;font-weight:600}

.tot{width:100%;border-collapse:collapse;font-size:15px}
.tot th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:12px 14px 6px}
.tot th:first-child,.tot td:first-child{text-align:left;color:var(--muted);font-weight:500}
.tot td{text-align:right;padding:9px 14px;border-top:1px solid var(--line);font-weight:600}
.tot .sum td{font-size:18px;letter-spacing:-.03em;font-weight:700;padding:12px 14px 14px;background:var(--card-2)}
.tot .sum td:first-child{color:var(--ink);font-size:15px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .45s var(--ease);z-index:21}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;letter-spacing:-.03em;line-height:1.2;padding-right:30px}
.sheet .x{position:absolute;right:16px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:13px}
.sheet .meta{font-size:13px;color:var(--muted);margin-top:4px}
.lv{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.lv:last-of-type{border:0}
.lv b{font-size:20px;letter-spacing:-.03em}
.lv .pp{font-size:12px;margin-left:6px}
.sheet .note{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.4}

/* weeks */
.swipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 16px 6px}
.wk{min-width:0;border-radius:20px;padding:14px;text-align:left;transition:transform .25s var(--ease),outline-color .25s;outline:2px solid transparent}
.wk.on{outline-color:var(--ink)}
.wk:active{transform:scale(.97)}
.wk small{font-size:12px;color:var(--muted)}
.wk .p{font-size:26px;font-weight:700;letter-spacing:-.04em;color:var(--green);margin-top:8px}
.wk .p.est{color:var(--muted)}
.wk .m{font-size:12px;color:var(--muted);margin-top:2px}
.wk.dash{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.tx{padding:0 16px}
.t{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);animation:pop .35s var(--ease) both}
.t:last-child{border:0}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.t .ic{width:38px;height:38px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;font-size:18px;flex:none}
.t .nm{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.25}
.t .nm small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
.t .amt{font-weight:600;white-space:nowrap;text-align:right}
.t .amt small{display:block;font-size:12px;font-weight:600}
.est-box{margin:12px 16px 0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.est-box .v{font-size:24px;font-weight:700;letter-spacing:-.03em}
.est-box .k{font-size:12px;color:var(--muted)}

/* goal */
.pad{padding:16px;margin:12px 16px 0}
.rate{display:flex;justify-content:space-between;align-items:baseline}
.rate .v{font-size:30px;font-weight:700;letter-spacing:-.04em}
input[type=range]{width:100%;accent-color:var(--green);height:30px;margin:4px 0}
.chart{width:100%;height:auto;display:block;margin:4px 0;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.fact{padding:12px;background:var(--card-2);border-radius:14px}
.fact .v{font-size:19px;font-weight:700;letter-spacing:-.03em}
.fact .k{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
.pb{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden;margin-top:10px}
.pb i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width 1.4s var(--ease)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:120px;height:120px;flex:none}
.donut circle{fill:none;stroke-width:14;transition:stroke-dasharray 1.2s var(--ease)}
.lg{list-style:none;padding:0;flex:1;font-size:14px}
.lg li{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.lg li span:first-child{display:flex;align-items:center;gap:8px}
.lg .dot{width:9px;height:9px;border-radius:50%}

/* items */
.filter{display:flex;background:var(--card-2);border-radius:12px;padding:4px;gap:4px;margin:14px 16px 10px}
.filter button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
.filter button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filter button em{font-style:normal;font-weight:500;opacity:.7;margin-left:3px}
.list{margin:0 16px}
.list .t{padding:11px 14px}
.list .dot{width:9px;height:9px;border-radius:50%;flex:none}
.list .t.hide{display:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:9;height:calc(74px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center}
.tabbar button{text-align:center;font-size:10px;color:var(--muted);flex:1;max-width:80px;padding:6px 0;transition:color .2s,transform .2s var(--ease)}
.tabbar button b{display:block;font-size:22px;font-weight:400;line-height:1.1;margin-bottom:2px}
.tabbar button.on{color:var(--blue)}
.tabbar button:active{transform:scale(.92)}

.loading{padding:80px 20px;text-align:center;color:var(--muted)}
footer{padding:28px 20px 8px;text-align:center;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.c{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Loading…</div></div>
<div class="bar" id="bar"></div>
<nav class="tabbar" id="tabbar">
  <button data-v="board" class="on"><b>▦</b>Board</button>
  <button data-v="stock"><b>▣</b>Stock</button>
  <button data-v="weeks"><b>▤</b>Weeks</button>
  <button data-v="goal"><b>↗</b>Goal</button>
  <button data-v="items"><b>≡</b>Items</button>
  <button data-v="kept"><b>⌂</b>Kept</button>
</nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number.isInteger(Math.round(n * 100) / 100) ? Math.round(n).toLocaleString('en-NZ') : n.toLocaleString('en-NZ', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const $m = n => (n < 0 ? '−$' : '$') + num(Math.abs(n));
const $s = n => (n < 0 ? '−$' : '+$') + num(Math.abs(n));
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const DAY = 864e5, TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const fmtD = (d, o = {day: 'numeric', month: 'short'}) => new Date(d).toLocaleDateString('en-NZ', o);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k, v){try{localStorage.setItem(k, v)}catch{}}};
const saved = store.get('fl-theme'); if (saved) document.documentElement.dataset.theme = saved;

/* ---------- maths: everything from data.json ---------- */
function calc(d) {
  const by = s => d.items.filter(i => i.status === s);
  const sold = by('sold'), stock = by('stock'), kept = by('kept'), disputed = by('disputed');
  const fuel = sum(d.trips, t => t.fuel);
  const t = { sold: sum(sold, i => i.sold), cost: sum(sold, i => i.cost), fuel,
    stockCost: sum(stock, i => i.cost), stockList: sum(stock, i => i.list), stockAccept: sum(stock, i => i.accept), kept: sum(kept, i => i.cost) };
  t.profit = t.sold - t.cost - fuel;
  t.cashIn = sum(sold.filter(i => i.paid !== false), i => i.sold);
  t.spent = sum(d.items.filter(i => !i.own && i.status !== 'disputed'), i => i.cost) + fuel;
  t.account = t.cashIn - t.spent;
  t.weeksDone = Math.max(0, ...sold.map(i => i.soldWeek || 0), ...d.trips.map(x => x.week || 0));
  t.pace = t.weeksDone ? t.profit / t.weeksDone : 0;
  const weeks = d.weeks.map(w => {
    const s = sold.filter(i => i.soldWeek === w.n), tr = d.trips.filter(x => x.week === w.n);
    const bought = d.items.filter(i => i.boughtWeek === w.n && !i.own && (i.status === 'sold' || i.status === 'stock'));
    return { ...w, sold: s, trips: tr, bought, profit: sum(s, i => i.sold - i.cost) - sum(tr, x => x.fuel), real: s.length > 0 || tr.length > 0 };
  });
  const est = d.estimate && { ...d.estimate, likely: t.stockAccept - t.stockCost - (d.estimate.fuel || 0), best: t.stockList - t.stockCost };
  const flip = d.items.filter(i => !i.own && (i.status === 'sold' || i.status === 'stock'));
  const pay = { owed: sum(flip, i => i.cost) + fuel, back: sum(sold.filter(i => !i.own && i.paid !== false), i => i.sold), waiting: sold.filter(i => i.paid === false) };
  const board = {
    collect: stock.filter(i => i.collected === false),
    home: stock.filter(i => i.collected !== false && !i.listed),
    listed: stock.filter(i => i.collected !== false && i.listed),
    sold: sold.slice().sort((a, b) => (b.soldWeek || 0) - (a.soldWeek || 0))
  };
  return { sold, stock, kept, disputed, t, weeks, est, pay, board };
}
/* days on shelf: exact if a date is given, else from the start of the week it was bought in */
function daysHeld(i, d) {
  const w = d.weeks.find(w => w.n === i.boughtWeek);
  const from = i.bought || (w && w.start); if (!from) return null;
  if (i.status === 'sold' && !i.soldDate) return null;           // no sold date yet: fall back to weeks

      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v ? '$' + (v >= 1000 ? v / 1000 + 'k' : v) : '0'}</text>`).join('')}
      ${months.filter(m => m[0] <= weeks).map(([w, l]) => `<text x="${X(w)}" y="${H - 6}" text-anchor="middle">${l}</text>`).join('')}
      <path d="${line} L${X(weeks)},${Y(0)} L${X(0)},${Y(0)}Z" fill="url(#ga)"/>
      <line x1="${L}" x2="${W - R}" y1="${Y(D.goal)}" y2="${Y(D.goal)}" stroke="var(--red)" stroke-dasharray="4 4"/>
      <text x="${W - R}" y="${Y(D.goal) - 5}" text-anchor="end" style="fill:var(--red);font-weight:700">${$m(D.goal)}</text>
      <path d="${line}" stroke="var(--green)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="${X(0)}" cy="${Y(t.profit)}" r="5" fill="var(--green)" stroke="var(--card)" stroke-width="2"/>
      ${toGoal <= weeks ? `<circle cx="${X(toGoal)}" cy="${Y(D.goal)}" r="6" fill="var(--card)" stroke="var(--green)" stroke-width="3"/>` : ''}`;
    const fact = (v, k) => `<div class="fact"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    $('#facts').innerHTML = fact(fmtD(hit), `${Math.ceil(toGoal)} weeks to ${$m(D.goal)}`) + fact($m(Math.round(t.profit + r * wkTo(xmas))), 'by Christmas') + fact($m(Math.round(t.profit + r * wkTo(april))), 'by 1 April');
  };
  $('#rate').oninput = draw; draw();
}
function countUp(el, to) {
  if (reduce) return el.textContent = $m(to);
  const t0 = performance.now(), dur = 1400;
  setTimeout(() => el.textContent = $m(to), dur + 200);   // safety net if the tab is in the background
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = $m(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

fetch('data.json', {cache: 'no-store'}).then(r => { if (!r.ok) throw r.status; return r.json(); })
  .then(d => { D = d; C = calc(d); render(); })
  .catch(e => $('#app').innerHTML = `<div class="loading">Couldn't load data.json (${esc(e)}).</div>`);
})();
</script>
