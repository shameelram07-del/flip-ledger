<!doctype html>
<html lang="en-NZ" data-pal="sunset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip Ledger</title>
<meta name="description" content="Tool flipping: money made, board, weeks and the road to $5k.">
<meta name="theme-color" content="#120B0A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip Ledger">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080C; --panel:#151A20; --line:#1F262E; --track:#1C232B; --ink:#EDF1F5; --mut:#96A0AC; --dim:#7F8A97;
  --lime:#C6F432; --lime-2:#8DB324; --red:#FF7A6B; --amber:#FFC14D; --grey:#5B6670;
  --acc-rgb:198,244,50; --panel-rgb:21,26,32; --outer:#06070A; --line2:#262E37; --paper:#F4F5F7; --paper-ink:#08080C;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --display:"Space Grotesk",Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
/* palettes from the reels, 60 / 30 / 10 */
:root[data-pal="navy"]{--bg:#0E1729;--panel:#16223A;--line:#22304C;--track:#1B2943;--ink:#F3EDE2;--mut:#A9B0C0;--dim:#8790A3;--lime:#FF8A70;--lime-2:#D9664F;--red:#FF4D6D;--acc-rgb:255,138,112;--panel-rgb:22,34,58;--outer:#0A1120;--line2:#2A3A5A;--paper:#F3EDE2;--paper-ink:#0E1729}
:root[data-pal="forest"]{--bg:#0D1A14;--panel:#142620;--line:#1F3329;--track:#1A2C24;--ink:#EFE8D8;--mut:#A8B3A8;--dim:#8A968C;--lime:#B57CFF;--lime-2:#8F5AE0;--acc-rgb:181,124,255;--panel-rgb:20,38,32;--outer:#08120D;--line2:#284035;--paper:#EFE8D8;--paper-ink:#0D1A14}
:root[data-pal="sunset"]{--bg:#120B0A;--panel:#1E1412;--line:#2E201C;--track:#261A17;--ink:#F6EEE8;--mut:#B3A49C;--dim:#94867F;--lime:#FF7A2F;--lime-2:#D9561A;--red:#FF4D6D;--acc-rgb:255,122,47;--panel-rgb:30,20,18;--outer:#0B0606;--line2:#3A2924;--paper:#F6EEE8;--paper-ink:#120B0A}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{min-height:100svh;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
button:active{transform:scale(.97)}
.app{max-width:480px;margin:0 auto;min-height:100svh;position:relative;overflow-x:clip;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
@media (min-width:520px){body{background:var(--outer)}.app{background:var(--bg);box-shadow:0 0 0 1px var(--line)}}

.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.k{font-size:11px;color:var(--mut);letter-spacing:.02em}
.u{font-size:13px;color:var(--mut);font-weight:500}
.lime{color:var(--lime)}.red{color:var(--red)}.amber{color:var(--amber)}.mut{color:var(--mut)}.white{color:var(--ink)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sh .h{font-size:17px}
.sh .num.h{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.01em;line-height:1}
.sh .num.h i{color:var(--lime)}
.serif{font-family:var(--serif);font-weight:400}
.loading{padding:80px 22px;text-align:center;color:var(--mut)}

/* top bar + hero */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 22px 0}
.wordmark{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.pill{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 9px}
.live{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}
.hero{position:relative;height:150svh;margin-top:-64px}
.hstage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center;padding:0 22px}
.hglow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(42% 34% at 50% 60%,rgba(var(--acc-rgb),.5),rgba(var(--acc-rgb),.07) 55%,transparent 75%)}
.hrays{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);mask-image:linear-gradient(to top,#000 10%,transparent 70%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 70%)}
.hin{position:relative;text-align:center;will-change:transform,opacity;width:100%}
.hin .up{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.bigv{font-size:clamp(84px,27vw,150px);font-weight:700;line-height:.9;margin-top:10px;letter-spacing:-.05em}
.tag{font-size:clamp(32px,9.5vw,50px);line-height:1.05;margin-top:14px}
.tag i{color:var(--lime)}
.gline{max-width:300px;margin:26px auto 0}
.gline .gl{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.gline .gl b{display:block;height:100%;border-radius:99px;background:var(--lime);box-shadow:0 0 14px rgba(var(--acc-rgb),.7);transform-origin:left;animation:growx 1.4s var(--ease) .3s backwards}
.gline span{display:block;font-size:12px;color:var(--mut);margin-top:8px}
.cue{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.cue i{display:block;width:1px;height:30px;margin:10px auto 0;background:linear-gradient(var(--mut),transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.amb{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70% 38% at 0% 0%,var(--amb1,rgba(var(--acc-rgb),.16)),transparent 70%),radial-gradient(70% 38% at 100% 100%,var(--amb2,rgba(var(--acc-rgb),.12)),transparent 70%);transition:opacity .6s}
.app{z-index:1}
.top{position:relative;z-index:3}

/* flips reel: one sold tool takes the screen per scroll step */
.reel{position:relative;margin:30px -22px 0}
.rstage{position:sticky;top:0;height:100svh;overflow:hidden}
.rglow{position:absolute;inset:-20%;pointer-events:none;transition:background .6s ease}
.bword{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 clamp(110px,40vw,210px)/1 var(--display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.10);white-space:nowrap;pointer-events:none}
.rcount{position:absolute;top:calc(70px + env(safe-area-inset-top));right:22px;font:500 12px/1 var(--display);color:var(--mut);z-index:2}
.rdots{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:7px;z-index:2}
.rdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
.rdots i.on{background:#fff;height:16px;border-radius:99px}
.flip{position:absolute;inset:0;width:100%;display:grid;grid-template-rows:auto 1fr auto;padding:calc(70px + env(safe-area-inset-top)) 28px calc(118px + env(safe-area-inset-bottom)) 22px;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .55s ease,transform .7s var(--ease);pointer-events:none}
.flip.on{opacity:1;transform:none;pointer-events:auto}
.flip .brand{font:700 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase}
.flip h3{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1;margin-top:10px;max-width:14ch;text-wrap:balance}
.flip .fic{display:grid;place-items:center}
.flip .fic svg{width:min(52vw,250px);height:auto;transform:rotate(-8deg);filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.flip .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.flip .money{font-size:13px;color:var(--mut)}
.flip .money b{display:block;font:700 18px/1.2 var(--display);color:var(--ink);margin-top:2px}
.flip .pr{text-align:right}
.flip .pr .num{font-size:clamp(48px,15vw,80px);line-height:.9}
.flip .pr small{display:block;font-size:12px;color:var(--mut);margin-top:6px}

/* statement */
.say{position:relative;height:170svh;margin:0 -22px}
.sstage{position:sticky;top:0;height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--paper-ink);padding:0 22px}
.sayp{font-family:var(--serif);font-size:clamp(46px,14vw,84px);line-height:1;text-align:center}
.sayp span{display:inline-block;opacity:.12;transition:opacity .35s}
.sayp span.lit{opacity:1}
.sayp .hl2{background:linear-gradient(transparent 62%,var(--lime) 62%)}
.sayp small{display:block;font:500 14px/1.4 var(--sans);color:#5B6670;margin-top:22px;opacity:0;transition:opacity .5s}
.sayp small.lit{opacity:1}

/* road to the car */
.road{position:relative;height:10px;border-radius:99px;background:var(--track);margin:22px 4px 10px}
.road b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--lime);box-shadow:0 0 22px rgba(var(--acc-rgb),.6);transform-origin:left;animation:growx 1.4s var(--ease) .2s backwards}
.road em{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);border:3px solid var(--lime);transform:translate(-50%,-50%)}
.road-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.cg{position:absolute;pointer-events:none;inset:auto -30% -75% -30%;height:120%;opacity:.55}
.sp{position:relative;overflow:hidden}
.sp > *:not(.cg){position:relative}
.sglow{position:absolute;left:0;right:0;top:0;height:240px;pointer-events:none;border-radius:24px 24px 0 0}
.sheet > *:not(.sglow){position:relative}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:18px 22px 0}
.tiles .v{font-size:26px;margin-top:4px;white-space:nowrap}
.tiles .k + .v + .k{margin-top:2px}

/* sticky compact bar */
.bar{position:fixed;top:0;left:0;right:0;max-width:480px;margin:0 auto;z-index:8;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;
  background:rgba(var(--panel-rgb),.88);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;transform:translateY(-100%);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none}
.bar.show{transform:none;opacity:1;pointer-events:auto}
.bar span{font-size:13px;color:var(--mut)}
.bar b{font-size:20px;color:var(--lime)}

/* shared rows */
.view{padding:26px 22px 0;min-width:0}
.ptitle{padding:calc(40px + env(safe-area-inset-top)) 0 8px}
.ptitle h1{font-size:clamp(46px,14vw,64px);line-height:.95;letter-spacing:-.01em}
.ptitle h1 i{color:var(--lime)}
.ptitle p{color:var(--mut);margin-top:10px;font-size:14px;max-width:36ch}
/* tab titles: words rise out of a mask, the accent word blurs in and gets an underline swash, the line under fades up */
.ptitle{will-change:transform,opacity}
.ptitle h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em .12em;margin:0 -.04em -.12em}
.ptitle h1 .w>span{display:inline-block;transform:translateY(110%) rotate(4deg);transform-origin:0 100%;animation:ptUp .95s var(--ease) forwards;animation-delay:calc(var(--k) * 90ms + 80ms)}
.ptitle h1 i{position:relative;display:inline-block}
.ptitle h1 i .w>span{filter:blur(8px);animation-name:ptUpBlur}
.ptitle h1 i::after{content:"";position:absolute;left:.06em;right:.12em;bottom:.02em;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--lime),rgba(var(--acc-rgb),.15));transform:scaleX(0);transform-origin:left;animation:ptLine .9s var(--ease) forwards;animation-delay:calc(var(--n) * 90ms + 420ms)}
.ptitle p{opacity:0;transform:translateY(12px);animation:ptFade .8s var(--ease) forwards;animation-delay:calc(var(--n) * 90ms + 300ms)}
@keyframes ptUp{to{transform:none}}
@keyframes ptUpBlur{60%{filter:blur(1px)}to{transform:none;filter:none}}
@keyframes ptLine{to{transform:scaleX(1)}}
@keyframes ptFade{to{opacity:1;transform:none}}
.storyl{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 8px;padding:18px;border-radius:18px;text-decoration:none;color:var(--ink);
  background:linear-gradient(120deg,rgba(var(--acc-rgb),.22),var(--panel) 60%);border:1px solid var(--line2)}
.storyl span{font:400 26px/1 'Instrument Serif',serif}
.storyl small{display:block;font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
.storyl b{font:600 13px Inter;color:var(--mut);white-space:nowrap}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .7s var(--ease);animation:none!important}
.rv.in{opacity:1;transform:none}
.rowp{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:8px;min-height:44px}
.rowp .nm{font-size:15px;font-weight:500;line-height:1.3}
.rowp .sub{font-size:12px;color:var(--mut);margin-top:3px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;line-height:1.3;white-space:nowrap;background:var(--track);color:var(--mut);flex:none}
.chip.green{background:rgba(var(--acc-rgb),.14);color:var(--lime)}.chip.amber{background:rgba(255,193,77,.14);color:var(--amber)}.chip.red{background:rgba(255,122,107,.16);color:var(--red)}.chip.grey{background:var(--track);color:var(--mut)}.chip.fill{background:var(--lime);color:var(--bg)}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico.sm{width:40px;height:40px;border-radius:12px}
.empty{margin-top:8px;padding:26px 14px;text-align:center;border:1px dashed var(--line2);border-radius:14px;color:var(--mut);font-size:14px}
.it{animation:rise .5s var(--ease) backwards}

/* board */
.hls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 26px}
.hl{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;min-width:0;width:100%;min-height:44px}
.hl .hd{display:flex;align-items:center;gap:6px;min-width:0}
.hl .hi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.hl .v{font-size:19px;margin-top:8px;white-space:nowrap}
.hl .s{font-size:11px;color:var(--mut);margin-top:2px}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.seg{display:block;width:100%;padding:10px 0 12px;min-height:44px}
.seg .sb{height:3px;border-radius:99px;background:var(--line2);margin-bottom:12px;transition:background .35s}
.seg.on .sb{background:var(--lime)}
.seg .c{font-size:24px;line-height:1;color:var(--dim);transition:color .3s}.seg.on .c{color:var(--ink)}
.seg .l{font-size:10px;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;white-space:nowrap;color:var(--dim);transition:color .3s}.seg.on .l{color:var(--lime)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-top .p{font-size:19px;white-space:nowrap}
.card-mid{display:flex;align-items:center;gap:8px;margin-top:5px}
.card-mid .br{font-size:11px;font-weight:700;flex:none}
.card-mid .sub{font-size:12px;color:var(--mut);flex:1;min-width:0;margin:0}
.mbar{display:flex;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:9px;gap:2px}
.mbar div{transform-origin:left;animation:growx .8s var(--ease) backwards}
.legend{display:flex;gap:8px 14px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;border-radius:99px}

/* stock */
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.st3 .tile{padding:12px}
.st3 .v{font-size:20px;margin-top:3px;white-space:nowrap}
.sp{display:block;width:100%;padding:14px;margin-top:10px}
.sp .hd{display:flex;align-items:center;gap:12px}
.sp .meta{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45}
.sp .note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.45;padding:8px 10px;background:var(--track);border-radius:10px}
.ld{display:grid;grid-template-columns:52px minmax(0,1fr) 64px 52px;gap:10px;align-items:center;margin-top:8px;font-size:12px}
.ld .track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.ld .fill{height:100%;border-radius:99px;transform-origin:left;animation:growx .9s var(--ease) backwards}
.ld .num{text-align:right;font-size:15px}
.ld > span:last-child{text-align:right}
.tot{padding:4px 14px 2px;margin-top:10px}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.tr span{text-align:right;font-variant-numeric:tabular-nums}
.tr span:first-child{text-align:left;color:var(--mut)}
.tr.head{border-top:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tr.head span{color:var(--mut)}
.tr .num{font-size:17px}

/* weeks */
.wkp{padding:16px 14px 12px;margin-top:10px}
.wkrow{display:flex;gap:10px;align-items:flex-end}
.wkb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:150px;min-width:0;text-align:center}
.wkb .b{width:100%;border-radius:6px 6px 2px 2px;background:rgba(var(--acc-rgb),.22);transition:background .35s;transform-origin:bottom;animation:grow .9s var(--ease) backwards}
.wkb.on .b{background:var(--lime)}
.wkb.neg .b{background:rgba(255,122,107,.3)}.wkb.neg.on .b{background:var(--red)}
.wkb .b.est{background:transparent;border:1px dashed #4A5660}
.wkb .v{font-size:11px;color:var(--dim);transition:color .3s;white-space:nowrap}.wkb.on .v{color:var(--lime)}.wkb.neg.on .v{color:var(--red)}
.wkb .lab{font-size:11px;color:var(--dim);transition:color .3s;white-space:nowrap}.wkb.on .lab{color:var(--ink)}
.amt{font-size:18px;white-space:nowrap}

/* goal */
.gp{padding:16px 14px}
.gp + .gp{margin-top:10px}
input[type=range]{width:100%;accent-color:var(--lime);height:30px;margin:6px 0}
.chart{width:100%;height:auto;display:block;overflow:visible;margin-top:4px}
.chart text{font-family:var(--sans)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.facts div{background:var(--track);border-radius:12px;padding:10px;min-width:0}
.facts .num{font-size:17px;white-space:nowrap}
.pbar{height:8px;border-radius:99px;background:var(--track);margin-top:12px;overflow:hidden}
.pbar div{height:100%;border-radius:99px;background:var(--lime);transform-origin:left;animation:growx 1s var(--ease) .2s backwards}
.gp p{margin:10px 0 0;font-size:13px;color:var(--mut);line-height:1.45}
.donut-wrap{display:flex;align-items:center;gap:16px;margin-top:14px}
.donut{width:112px;height:112px;flex:none;transform:rotate(-90deg)}
.lg{flex:1;min-width:0}
.lg div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.lg span:first-child{display:flex;align-items:center;gap:8px;color:var(--mut)}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.lg .num{font-size:15px}

/* items */
.sbox{position:relative;margin-top:10px}
.sbox svg{position:absolute;left:14px;top:13px}
.search{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 42px;outline:none;min-height:44px;-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:var(--lime)}
.fps{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.fps::-webkit-scrollbar{display:none}
.fp{flex:none;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mut);background:var(--panel);border:1px solid var(--line);min-height:44px;transition:background .25s,color .25s,border-color .25s}
.fp.on{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.fp em{font-style:normal;opacity:.7;margin-left:3px}
.ir-meta{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.ir-meta .sub{margin:0;min-width:0}
.ir-v{text-align:right;flex:none}
.ir-v .num{font-size:18px}
.ir-v div:last-child{font-size:12px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:9;height:calc(84px + env(safe-area-inset-bottom));padding:0 0 calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:stretch;background:rgba(var(--panel-rgb),.88);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
.ind{position:absolute;top:8px;height:58px;width:calc(100% / 6 - 12px);border-radius:16px;background:rgba(var(--acc-rgb),.10);transition:left .4s var(--ease)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0 8px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);min-height:44px;position:relative;z-index:1;transition:color .3s;text-align:center}
.tb.on{color:var(--lime)}
.tb.on svg{animation:pop .4s var(--ease)}

/* deals */
a.rowp{color:inherit;text-decoration:none}
.deal{align-items:flex-start}
.dnote{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.45}
.dfoot{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.45}
.seen{margin-top:8px}
.seen summary{list-style:none;cursor:pointer;font-size:13px;color:var(--mut);padding:10px 14px;border:1px dashed var(--line2);border-radius:14px;min-height:44px;display:flex;align-items:center;justify-content:space-between}
.seen summary::-webkit-details-marker{display:none}
.seen summary::after{content:'Show';color:var(--lime);font-weight:500}
.seen[open] summary::after{content:'Hide'}
.seen .rowp{opacity:.6}
.newtag{font:600 10px Inter;letter-spacing:.12em;color:var(--bg);background:var(--lime);border-radius:99px;padding:3px 7px;margin-right:6px}

/* item sheet */
.sw{position:fixed;inset:0;z-index:30;max-width:480px;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end}
.sw .dim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .3s ease backwards;width:100%}
.sheet{position:relative;background:var(--panel);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:12px 22px calc(34px + env(safe-area-inset-bottom));max-height:88svh;overflow-y:auto;animation:up .45s var(--ease) backwards}
.grab{width:36px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 16px}
.sh-top{display:flex;align-items:center;gap:14px}
.sh-top .ico{width:56px;height:56px;border-radius:16px}
.sh-br{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sh-nm{font-size:20px;line-height:1.2;margin-top:2px}
.x{width:44px;height:44px;display:grid;place-items:center;flex:none;align-self:flex-start;margin:-4px -8px 0 0}
.x span{width:36px;height:36px;display:grid;place-items:center;background:var(--track);border-radius:50%}
.sh-meta{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.45}
.sr{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sr .kk{flex:1;font-size:14px;color:var(--mut)}
.sr .num{font-size:21px}
.sr .pp{font-size:12px;min-width:52px;text-align:right}
.sh-note{margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--mut);background:var(--track);border-radius:12px;padding:10px 12px}
footer{padding:26px 22px 0;font-size:11px;color:var(--grey);text-align:center}

/* motion */
.gauge{animation:arc 1.6s var(--ease) backwards}
.ring{animation:ringin 1.1s var(--ease) backwards}
.chart.still .ring{animation:none}
.rise{animation:rise .5s var(--ease) backwards}
.live{animation:pulse 2.2s ease-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes arc{from{stroke-dasharray:0 2000}}
@keyframes ringin{from{stroke-dasharray:0 999}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.55)}100%{box-shadow:0 0 0 8px rgba(var(--acc-rgb),0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="amb" id="amb" aria-hidden="true"></div>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Math.round(n).toLocaleString('en-NZ');   // whole dollars everywhere; cents (e.g. $0.99 fees) stay in data.json
const $m = n => (n < 0 ? '−$' : '$') + num(Math.abs(n));
const $s = n => (n < 0 ? '−$' : '+$') + num(Math.abs(n));
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
/* dates in data.json are local NZ days, so parse them as local dates */
const pd = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const DAY = 864e5, TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const fmtD = (d, o = {day: 'numeric', month: 'short'}) => (d instanceof Date ? d : pd(d)).toLocaleDateString('en-NZ', o);
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)).toFixed(1) : '0';
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const delay = n => Math.min(420, n * 55);
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
try { const pal = new URLSearchParams(location.search).get('pal'); if (/^(navy|forest|sunset|midnight)$/.test(pal || '')) document.documentElement.dataset.pal = pal; } catch (e) {}

/* ---------- maths: everything from data.json ---------- */
function calc(d) {
  const by = s => d.items.filter(i => i.status === s);
  const sold = by('sold'), stock = by('stock'), kept = by('kept'), disputed = by('disputed');
  const fuel = sum(d.trips, t => t.fuel);
  const t = { sold: sum(sold, i => i.sold), cost: sum(sold, i => i.cost), fuel,
    stockCost: sum(stock, i => i.cost), stockList: sum(stock, i => i.list), stockAccept: sum(stock, i => i.accept), stockWorst: sum(stock, i => i.worst), kept: sum(kept, i => i.cost) };
  t.profit = t.sold - t.cost - fuel;
  t.cashIn = sum(sold.filter(i => i.paid !== false), i => i.sold);
  t.spent = sum(d.items.filter(i => !i.own && i.status !== 'disputed'), i => i.cost) + fuel;
  t.account = t.cashIn - t.spent;
  t.joint = sum(d.items.filter(i => i.paidFrom === 'joint' && (i.status === 'sold' || i.status === 'stock')), i => i.cost) - sum(d.repaid || [], x => x.amount);
  /* money made: paid sales minus everything bought to flip (sold or not) and fuel; kept items left out */
  /* in the bank: paid sales minus everything paid from my own accounts (flip buys, fuel, kept items, personal spending) and joint repayments */
  t.bank = t.cashIn - sum(d.items.filter(i => !i.own && i.paidFrom !== 'joint' && ['sold', 'stock', 'kept'].includes(i.status)), i => i.cost) - fuel - sum(d.personal || [], x => x.amount) - sum(d.repaid || [], x => x.amount);
  t.flipCash = t.cashIn - sum(d.items.filter(i => !i.own && (i.status === 'sold' || i.status === 'stock')), i => i.cost) - fuel;
  t.weeksDone = Math.max(0, ...sold.map(i => i.soldWeek || 0), ...d.trips.map(x => x.week || 0));
  t.pace = t.weeksDone ? t.profit / t.weeksDone : 0;
  const weeks = d.weeks.map(w => {
    const s = sold.filter(i => i.soldWeek === w.n), tr = d.trips.filter(x => x.week === w.n);
    const bought = d.items.filter(i => i.boughtWeek === w.n && !i.own && (i.status === 'sold' || i.status === 'stock'));
    return { ...w, sold: s, trips: tr, bought, profit: sum(s, i => i.sold - i.cost) - sum(tr, x => x.fuel), real: s.length > 0 || tr.length > 0 };
  });
  const est = d.estimate && { ...d.estimate, likely: t.stockAccept - t.stockCost - (d.estimate.fuel || 0), best: t.stockList - t.stockCost };
  const flip = d.items.filter(i => !i.own && (i.status === 'sold' || i.status === 'stock'));
  const pay = { owed: sum(flip, i => i.cost) + fuel, back: sum(sold.filter(i => !i.own && i.paid !== false), i => i.sold), waiting: sold.filter(i => i.paid === false) };
  const board = {
    collect: stock.filter(i => i.collected === false),
    home: stock.filter(i => i.collected !== false && !i.listed),
    listed: stock.filter(i => i.collected !== false && i.listed),

  };

}
/* days on shelf: exact if a date is given, else from the start of the week it was bought in */
function daysHeld(i, d) {
  const w = d.weeks.find(w => w.n === i.boughtWeek);

  const to = i.soldDate ? pd(i.soldDate) : TODAY;

}

  const h = daysHeld(i, d); if (h) return `${h.approx ? '~' : ''}${h.n} day${h.n === 1 ? '' : 's'}`;
  if (i.boughtWeek && i.soldWeek) { const n = i.soldWeek - i.boughtWeek; return n ? `${n} wk${n === 1 ? '' : 's'}` : 'same week'; }
  return '';
}
const stockState = i => i.collected === false ? 'paid, to collect' : i.listed ? 'listed' : 'at home, not listed';
const ageTag = i => { const h = daysHeld(i, D); if (!h) return { tag: 'own', cls: 'grey' }; return { tag: `${h.approx ? '~' : ''}${h.n} d`, cls: h.n >= 10 ? 'red' : h.n >= 7 ? 'amber' : 'green' }; };
const unc = (i, f) => (i.unconfirmed || []).includes(f) ? ' (not confirmed)' : '';

/* ---------- look: one line icon per kind of product, brand colours lifted for a dark ground ---------- */
const ICON = {
  tablesaw: 'M3 13h18M6 13v6M18 13v6M8.5 13a3.5 3.5 0 0 1 7 0M12 9.5V7',
  planer: 'M4 9h16v9H4zM6 9l2-4h8l2 4M8 18v2M16 18v2M8 13.5h8',
  mower: 'M4 12h11l2-5h3M4.5 15a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M12.5 15a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0',
  drill: 'M3 9h11v6H3zM14 10h3l3 2-3 2h-3M6 15l-1 5h5l-1-5',
  jigsaw: 'M4 10h10l3 3v3H4zM8 10V6h6v4M11 16v4M4 13h4',

  tyre: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 4v5M12 15v5M4 12h5M15 12h5',

  bits: 'M7 3v18M12 3v18M17 3v18M5 8l4 2M10 8l4 2M15 8l4 2M5 14l4 2M10 14l4 2M15 14l4 2',

  shed: 'M3 11l9-7 9 7v9H3zM10 20v-6h4v6',
  battery: 'M3 8h15v8H3zM18 10h2v4h-2M7 11v2M11 11v2M14 11v2',
  bulb: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 3z',

  knife: 'M3 17l12-12 3 3-9 9H3zM14 5l2-2',
  bar: 'M3 5h18M6 5v14M18 5v14M9 9h6',
  tread: 'M3 17l15-4 3 1-15 4zM3 17v2M18 13V6M6 21h12',
  screwdriver: 'M3 21l7-7M10 14l-1-1 6-6 2 2-6 6zM15 7l2-2 2 2-2 2',

  box: 'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8'
};
const iconFor = n => /table saw/i.test(n) ? ICON.tablesaw : /planer/i.test(n) ? ICON.planer : /mower/i.test(n) ? ICON.mower : /drill/i.test(n) ? ICON.drill : /jigsaw/i.test(n) ? ICON.jigsaw : /cut-off|mitre/i.test(n) ? ICON.cutoff : /compressor|tyre/i.test(n) ? ICON.tyre : /socket/i.test(n) ? ICON.wrench : /auger|\bbit/i.test(n) ? ICON.bits : /scalextric/i.test(n) ? ICON.car : /shed/i.test(n) ? ICON.shed : /batter/i.test(n) ? ICON.battery : /light|lamp/i.test(n) ? ICON.bulb : /remote/i.test(n) ? ICON.remote : /knife/i.test(n) ? ICON.knife : /pull-up/i.test(n) ? ICON.bar : /treadmill|walking/i.test(n) ? ICON.tread : /screwdriver/i.test(n) ? ICON.screwdriver : /lock/i.test(n) ? ICON.lock : ICON.box;
const BRANDS = [[/dewalt/i, 'DeWalt', '#FFC933'], [/ryobi/i, 'Ryobi', '#C6E04A'], [/makita/i, 'Makita', '#2FC0BE'], [/bosch/i, 'Bosch', '#4D9BE8'], [/ozito/i, 'Ozito', '#FF5A57'], [/black\+decker|black & decker/i, 'Black+Decker', '#FF8C42'], [/stanley/i, 'Stanley', '#FFD84D'], [/kincrome/i, 'Kincrome', '#4D8FE0'], [/scalextric/i, 'Scalextric', '#FF5C6E'], [/toolpro/i, 'ToolPro', '#FF6B5E'], [/gearup/i, 'GearUp', '#96A0AC'], [/keter/i, 'Keter', cv('--lime-2')], [/lenovo/i, 'Lenovo', '#FF6B5E']];
const vis = i => { const b = BRANDS.find(x => x[0].test(i.name)); const color = b ? b[2] : '#96A0AC'; return { brand: b ? b[1] : '', color, tileBg: tint(color, .14), icon: iconFor(i.name) }; };
const svgI = (d, size = 24, sw = 1.8) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const icoTile = (v, sm) => `<span class="ico${sm ? ' sm' : ''}" style="background:${v.tileBg};color:${v.color}">${svgI(v.icon, sm ? 22 : 24)}</span>`;
const chip = (tag, cls) => `<span class="chip ${cls}">${esc(tag)}</span>`;

/* ---------- render ---------- */
let D, C;
const state = { tab: 'board', stage: 'listed', week: null, filter: 'all', q: '', rate: null };
const TABS = ['board', 'stock', 'weeks', 'goal', 'items', 'deals'];
{ const q = new URLSearchParams(location.search).get('tab'); if (TABS.includes(q)) state.tab = q; }
let DEALS = null;

function render() {
  const t = C.t, goalPct = Math.max(0, Math.min(100, t.flipCash / D.goal * 100)), ARC = Math.PI * 148;
  const tile = (n, k, v, sub, cls = '') => `<div class="tile rise" style="animation-delay:${120 + n * 80}ms"><div class="k">${k}</div><div class="num v ${cls}">${v}</div><div class="k">${sub}</div></div>`;
  $('#app').innerHTML = `
  <header class="top">
    <div class="num wordmark">Flip Ledger</div>
    <div class="pill"><span class="live"></span>Updated ${fmtD(D.updated)}</div>
  </header>
  <section class="hero" id="hero"><div class="hstage">
    <div class="hglow"></div><div class="hrays"></div>
    <div class="hin" id="hin">
      <div class="up">In the bank now</div>
      <div class="num bigv" id="bigv">$0</div>
      <div class="serif tag">Buy it cheap.<br><i>Sell it fast.</i></div>
      <div class="gline"><div class="gl"><b style="width:${goalPct.toFixed(1)}%"></b></div><span>${$m(t.flipCash)} made from flipping · ${goalPct.toFixed(0)}% of the ${$m(D.goal)} car goal</span></div>
    </div>
    <div class="cue" id="cue">Scroll<i></i></div>
  </div></section>
  <section class="tiles" id="tiles">
    ${tile(0, 'Profit on items sold', '<span id="profv">$0</span>', `${C.sold.length} items sold`, 'lime')}
    ${tile(1, 'Pace per week', `${$m(Math.round(t.pace))}<span class="u"> /wk</span>`, `over ${t.weeksDone} week${t.weeksDone === 1 ? '' : 's'}`)}
    ${tile(2, 'Still to sell', `${$m(t.stockCost)}<span class="u"> paid</span>`, `${C.stock.length} item${C.stock.length === 1 ? '' : 's'} · could bring ${$m(t.stockAccept)}`)}

  <footer>Every number is worked out from data.json</footer>`;
  $('#bar').innerHTML = `<span>In the bank</span><b class="num">${$m(t.bank)}</b>`;
  showView();
  countUp($('#bigv'), t.bank); countUp($('#profv'), t.profit);
}

function showView() {
  const v = state.tab, el = $('#view');
  el.innerHTML = `<div class="view rise">${{ board: boardView, stock: stockView, weeks: weeksView, goal: goalView, items: itemsView, deals: dealsView }[v]()}</div>`;
  $$('#tabbar .tb').forEach(b => b.classList.toggle('on', b.dataset.tab === v));
  $('#ind').style.left = `calc(${TABS.indexOf(v) * 100 / TABS.length}% + 6px)`;
  if (v === 'goal') drawChart(false);
  const onBoard = v === 'board';

}

/* board */
const STAGES = [['collect', 'To collect'], ['home', 'At home'], ['listed', 'Listed'], ['sold', 'Sold']];
function boardView() {
  const flips = C.sold.filter(i => !i.own), real = C.weeks.filter(w => w.real);
  const best = flips.slice().sort((a, b) => (b.sold - b.cost) - (a.sold - a.cost))[0];
  const fastest = flips.map(i => ({ i, h: daysHeld(i, D) })).filter(x => x.h).sort((a, b) => a.h.n - b.h.n)[0];
  const lastW = real[real.length - 1], prevW = real[real.length - 2];
  const hl = (n, k, v, sub, cls, icon, color, act) => `<button class="hl it" style="animation-delay:${n * 70}ms" ${act}>
      <div class="hd"><span class="hi" style="background:${tint(color, color === cv('--ink') ? .10 : .14)};color:${color}">${svgI(icon, 14, 2)}</span><span class="k ell">${k}</span></div>
      <div class="num v ${cls}">${v}</div><div class="s ell">${esc(sub)}</div></button>`;
  const hls = [
    best && hl(0, 'Best flip', $s(best.sold - best.cost), best.name, 'lime', 'M3 17l6-6 4 4 8-8M14 7h7v7', cv('--lime'), `data-act="item" data-id="${esc(best.id)}"`),
    fastest && hl(1, 'Fastest flip', `${fastest.h.approx ? '~' : ''}${fastest.h.n} days`, fastest.i.name, '', 'M13 2L4 14h7l-1 8 9-12h-7z', '#FFC14D', `data-act="item" data-id="${esc(fastest.i.id)}"`),
    lastW && hl(2, 'This week', $s(lastW.profit), prevW ? `${$s(lastW.profit - prevW.profit)} vs last week` : 'first week', lastW.profit < 0 ? 'red' : 'lime', 'M3 4h18v17H3zM3 10h18M8 2v4M16 2v4', cv('--ink'), 'data-act="tab" data-tab="weeks"')
  ].filter(Boolean).join('');
  return `
    ${hls ? `<div class="sh"><span class="num h">Highlights</span><span class="k">from everything sold</span></div><div class="hls">${hls}</div>` : ''}

    <div class="segs" id="segs">${STAGES.map(([k, l]) => `<button class="seg ${state.stage === k ? 'on' : ''}" data-act="stage" data-stage="${k}"><div class="sb"></div><div class="num c">${C.board[k].length}</div><div class="l">${l}</div></button>`).join('')}</div>
    <div id="stagelist">${stageList()}</div>
    <div class="legend">
      <span><i style="width:14px;height:4px;background:#3A4450"></i>what I paid</span>
      <span><i style="width:14px;height:4px;background:var(--lime)"></i>profit</span>
      <span><i style="width:8px;height:8px;background:var(--lime)"></i>under a week</span>
      <span><i style="width:8px;height:8px;background:var(--amber)"></i>7+ days</span>
      <span><i style="width:8px;height:8px;background:var(--red)"></i>10+ days, drop the price</span>
    </div>

      <div class="rdots" id="rdots">${flips.map(() => '<i></i>').join('')}</div>
      ${flips.map((i, n) => { const v = vis(i), p = i.sold - i.cost; return `<button class="flip" data-act="item" data-id="${esc(i.id)}" data-n="${n}" aria-label="${esc(i.name)}">
        <div><div class="brand" style="color:${v.color}">${esc(v.brand || 'Flip ' + (n + 1))}</div><h3>${esc(i.name.replace(/\s*\(.*?\)/g, ''))}</h3></div>
        <div class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="${v.color}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${v.icon}"/></svg></div>
        <div class="foot"><div class="money">Paid<b>${$m(i.cost)}${unc(i, 'cost')}</b><span style="display:block;margin-top:8px">Sold<b>${$m(i.sold)}</b></span></div>
          <div class="pr"><div class="num" style="color:${p >= 0 ? v.color : 'var(--red)'}">${$s(p)}</div><small>week ${i.soldWeek}${i === best ? ' · best flip' : ''}${!i.own && sellTime(i, D) ? ' · ' + sellTime(i, D) : ''}</small></div></div>
      </button>`; }).join('')}
    </div></section>
    <section class="say" id="say"><div class="sstage"><p class="sayp" id="sayp"><span>Less</span> <span>rush.</span><br><span><i>More</i></span> <span class="hl2">profit.</span>
      <small id="saysm">${flips.length} flips so far. Fast turnover beats big margins.</small></p></div></section>` : ''}
    <a class="storyl" href="story.html"><span><small>Watch</small>How a flip works</span><b>Find · Fix · Flip →</b></a>`;
}
function stageList() {
  const st = state.stage, arr = C.board[st];

    else { ({ tag, cls } = ageTag(i)); sale = i.list; if (st === 'listed') { main = $m(i.list); sub = `${$s(i.list - i.cost)} at list`; } else { main = $m(i.cost); sub = `${i.own ? 'own' : 'paid'} · list at ${$m(i.list)}`; } }

        <div class="mbar"><div style="width:${pct(i.cost, sale)}%;background:#3A4450"></div><div style="width:${pct(Math.max(0, sale - i.cost), sale)}%;background:${st === 'sold' ? cv('--lime') : cv('--lime-2')};animation-delay:.18s"></div></div>
      </div></button>`;
  }).join('');
}

/* stock */
function stockView() {
  const t = C.t, worstCls = t.stockWorst - t.stockCost >= 0 ? 'lime' : 'red', maxList = Math.max(1, ...C.stock.map(i => i.list));
  const tl = (n, k, sale, cls) => `<div class="tile it" style="animation-delay:${60 + n * 60}ms"><div class="k">${k}</div><div class="num v ${cls}">${$s(sale - t.stockCost)}</div><div class="k">sells ${$m(sale)}</div></div>`;
  const ld = (k, v, i, col, d) => `<div class="ld"><span class="k">${k}</span><div class="track"><div class="fill" style="background:${col};width:${pct(v, maxList)}%;animation-delay:${d}s"></div></div><span class="num">${$m(v)}</span><span class="${v - i.cost >= 0 ? 'lime' : 'red'}">${$s(v - i.cost)}</span></div>`;

        <div class="meta">${v.brand ? `<span style="font-weight:700;color:${v.color}">${v.brand}</span> ` : ''}${i.own ? 'Own' : 'Paid ' + $m(i.cost) + unc(i, 'cost')} · ${stockState(i)}</div>
      </div></div>
      ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
      <div style="margin-top:14px">${ld('List', i.list, i, cv('--lime'), .1)}${ld('Accept', i.accept, i, cv('--lime-2'), .2)}${ld('Worst', i.worst, i, '#5B6670', .3)}</div>
    </button>`; }).join('');
  return `

    <div class="st3">${tl(0, 'At list', t.stockList, 'lime')}${tl(1, 'If I accept', t.stockAccept, 'lime')}${tl(2, 'Worst case', t.stockWorst, worstCls)}</div>

      <div class="tr"><span class="white" style="font-weight:500">Profit</span><span class="num lime">${$s(t.stockList - t.stockCost)}</span><span class="num lime">${$s(t.stockAccept - t.stockCost)}</span><span class="num ${worstCls}">${$s(t.stockWorst - t.stockCost)}</span></div>

/* weeks */
function weeksView() {
  const real = C.weeks.filter(w => w.real);
  if (state.week == null || !real.some(w => w.n === state.week)) state.week = real.length ? real[real.length - 1].n : null;
  const estW = C.est && C.weeks.find(w => w.n === C.est.week && !w.real);
  const maxP = Math.max(1, ...real.map(w => Math.abs(w.profit)), estW ? Math.abs(C.est.likely) : 0);
  const bars = real.map((w, n) => `<button class="wkb ${w.n === state.week ? 'on' : ''} ${w.profit < 0 ? 'neg' : ''}" data-act="week" data-wk="${w.n}" aria-label="Week ${w.n}">
      <span class="num v">${$s(w.profit)}</span><div class="b" style="height:${Math.max(4, Math.round(Math.abs(w.profit) / maxP * 100))}px;animation-delay:${n * 90}ms"></div><span class="lab">Wk ${w.n}</span></button>`).join('')
    + (estW ? `<div class="wkb"><span class="num v">${$s(C.est.likely)}</span><div class="b est" style="height:${Math.max(4, Math.round(Math.abs(C.est.likely) / maxP * 100))}px"></div><span class="lab">Wk ${estW.n} est.</span></div>` : '');
  return `
    <div class="ptitle"><h1 class="serif">Week by <i>week</i></h1><p>Profit each week after fuel. Tap a bar to see what sold.</p></div>
    <div class="panel wkp"><div class="wkrow" id="wkbars">${bars || '<div class="k">No sales yet</div>'}</div></div>
    <div id="wkdetail">${weekDetail()}</div>`;
}
function weekDetail() {
  const w = C.weeks.find(w => w.n === state.week); if (!w) return '';
  const rows = w.sold.map((i, n) => { const v = vis(i); return `<button class="rowp it" style="animation-delay:${delay(n)}ms" data-act="item" data-id="${esc(i.id)}">${icoTile(v, 1)}
      <div class="grow"><div class="nm">${esc(i.name)}</div><div class="sub">${[i.own ? 'Own' : 'Paid ' + $m(i.cost) + unc(i, 'cost'), 'sold ' + $m(i.sold) + unc(i, 'sold'), !i.own && sellTime(i, D) ? sellTime(i, D) : ''].filter(Boolean).join(' · ')}</div></div>
      <div class="num amt lime">${$s(i.sold - i.cost)}</div></button>`; }).join('')
    + w.trips.map((x, n) => `<div class="rowp it" style="animation-delay:${delay(w.sold.length + n)}ms">${icoTile({ icon: ICON.fuel, color: '#FF7A6B', tileBg: tint('#FF7A6B', .14) }, 1)}
      <div class="grow"><div class="nm">Fuel</div><div class="sub">${esc(x.label || 'Trip ' + x.id)} · ${x.km} km</div></div>
      <div class="num amt red">${$s(-x.fuel)}</div></div>`).join('');
  const bought = w.bought.map((i, n) => `<button class="rowp it" style="animation-delay:${delay(n)}ms" data-act="item" data-id="${esc(i.id)}">${icoTile(vis(i), 1)}
      <div class="grow"><div class="nm">${esc(i.name)}</div><div class="sub">${i.status === 'sold' ? 'Sold week ' + i.soldWeek : stockState(i)}</div></div>
      <div class="num amt">${$m(i.cost)}</div></button>`).join('');
  return `
    <div class="sh" style="margin-top:22px"><span class="num h">Week ${w.n}</span><span class="k">${esc(w.label)} · ${[w.sold.length + ' sold', w.trips.length ? w.trips.length + ' trip' + (w.trips.length === 1 ? '' : 's') : ''].filter(Boolean).join(' · ')}</span></div>
    ${rows}
    ${bought ? `<div class="sh" style="margin-top:22px"><span class="num h">Bought to flip</span><span class="k">${$m(sum(w.bought, i => i.cost))}</span></div>${bought}` : ''}`;
}

/* goal */
function goalView() {
  const t = C.t, p = C.pay, payPct = p.owed ? Math.min(100, p.back / p.owed * 100) : 100, done = p.back >= p.owed;
  if (state.rate == null) state.rate = Math.max(50, Math.round(t.pace / 10) * 10);
  const parts = [['Cost of sold', t.cost, cv('--lime')], ['On the shelf', t.stockCost, cv('--ink')], ['Kept', t.kept, '#5B6670'], ['Fuel', t.fuel, '#FF7A6B']];
  const total = sum(parts, x => x[1]), CIRC = 2 * Math.PI * 46; let off = 0;
  const rings = parts.map(([, v, col], n) => { const len = v / (total || 1) * CIRC, s = `<circle class="ring" r="46" cx="60" cy="60" fill="none" stroke-width="14" stroke="${col}" stroke-dasharray="${len.toFixed(2)} 999" stroke-dashoffset="${(-off).toFixed(2)}" style="animation-delay:${n * .25}s"/>`; off += len; return s; }).join('');
  const gPct = Math.max(0, Math.min(100, t.flipCash / D.goal * 100));
  return `
    <div class="ptitle"><h1 class="serif">The road to the <i>car</i></h1><p>${$m(Math.max(0, D.goal - t.flipCash))} to go to the ${$m(D.goal)} goal.</p></div>
    <div class="road it"><b style="width:${gPct.toFixed(1)}%"></b><em style="left:${gPct.toFixed(1)}%"></em></div>
    <div class="road-l" style="margin-bottom:18px"><span>${$m(t.flipCash)} made · ${gPct.toFixed(0)}%</span><span>${$m(D.goal)} goal</span></div>
    <div class="panel gp it">
      <div class="sh"><span class="k" style="font-size:13px">If I make, each week</span><span class="num lime" style="font-size:30px" id="rateV"></span></div>
      <input type="range" id="rate" min="50" max="800" step="10" value="${state.rate}" aria-label="Weekly profit">
      <svg class="chart" id="chart" viewBox="0 0 340 160" role="img" aria-label="Projection to the car goal"></svg>
      <div class="facts" id="facts"></div>
    </div>
    <div class="panel gp it" style="animation-delay:100ms">
      <div class="sh"><span class="num" style="font-size:16px">Paying myself back</span><span class="${done ? 'lime' : 'mut'}" style="font-size:12px;text-align:right">${done ? `Paid back · ${$m(p.back - p.owed)} clear` : `${$m(p.back)} of ${$m(p.owed)}`}</span></div>
      <div class="pbar"><div style="width:${payPct.toFixed(1)}%"></div></div>
      <p>Spent ${$m(p.owed)} on flip stock and fuel, ${$m(p.back)} back from flip sales so far.${p.waiting.length ? ' Waiting on ' + p.waiting.map(i => `${$m(i.sold)} for the ${esc(i.name.split(' ').slice(0, 2).join(' '))}`).join(', ') + '.' : ''}</p>
    </div>
    <div class="panel gp it" style="animation-delay:200ms">
      <div class="sh"><span class="num" style="font-size:16px">Where the money went</span><span class="k">${$m(total)}</span></div>
      <div class="donut-wrap">
        <svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Spending split">${rings}</svg>
        <div class="lg">${parts.map(([k, v, col]) => `<div><span><i style="background:${col}"></i>${k}</span><span class="num">${$m(v)}</span></div>`).join('')}</div>
      </div>
    </div>`;
}
function drawChart(still) {
  const t = C.t, rate = state.rate, start = pd(D.updated), CW = 340, CH = 160, L = 34, R = 8, T = 14, B = 24, N = 52;
  const end = t.flipCash + rate * N, top = Math.max(end, D.goal) * 1.08;
  const X = w => L + (CW - L - R) * w / N, Y = v => T + (CH - T - B) * (1 - v / top);
  const target = (m, dd) => { const x = new Date(start.getFullYear(), m, dd); if (x < start) x.setFullYear(x.getFullYear() + 1); return x; };
  const wkTo = dt => (dt - start) / DAY / 7;
  const toGoal = Math.max(0, (D.goal - t.flipCash) / rate), hit = new Date(+start + toGoal * 7 * DAY), hits = toGoal <= N;
  const months = [3, 6, 9, 12].map(m => { const dt = new Date(start.getFullYear(), start.getMonth() + m, 1); return [X(wkTo(dt)).toFixed(1), dt.toLocaleDateString('en-NZ', {month: 'short'})]; });
  const line = `M${X(0).toFixed(1)},${Y(t.flipCash).toFixed(1)} L${X(N).toFixed(1)},${Y(end).toFixed(1)}`;
  $('#rateV').textContent = $m(rate);
  const svg = $('#chart'); svg.classList.toggle('still', !!still);
  svg.innerHTML = `
    <line x1="${L}" x2="${CW - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="${cv('--line2')}"/>
    <line x1="${L}" x2="${CW - R}" y1="${Y(D.goal).toFixed(1)}" y2="${Y(D.goal).toFixed(1)}" stroke="#FF7A6B" stroke-dasharray="3 4"/>
    <text x="${CW - R}" y="${(Y(D.goal) - 5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="#FF7A6B">${$m(D.goal)}</text>
    <text x="28" y="${(Y(0) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="${cv('--mut')}">$0</text>
    ${months.map(([x, l]) => `<text x="${x}" y="156" text-anchor="middle" font-size="10" fill="${cv('--mut')}">${l}</text>`).join('')}
    <path d="${line} L${X(N).toFixed(1)},${Y(0).toFixed(1)} L${X(0).toFixed(1)},${Y(0).toFixed(1)}Z" fill="${cv('--lime')}" fill-opacity="0.10"/>
    <path class="ring" d="${line}" stroke="${cv('--lime')}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="400 999"/>
    <circle cx="${X(0).toFixed(1)}" cy="${Y(t.flipCash).toFixed(1)}" r="4.5" fill="${cv('--lime')}"/>
    ${hits ? `<circle cx="${X(toGoal).toFixed(1)}" cy="${Y(D.goal).toFixed(1)}" r="5" fill="${cv('--bg')}" stroke="${cv('--lime')}" stroke-width="2.5"/>` : ''}`;
  const fact = (v, k) => `<div><div class="num">${v}</div><div class="k" style="margin-top:2px">${k}</div></div>`;
  $('#facts').innerHTML = fact(hits ? fmtD(hit, {day: 'numeric', month: 'short', year: '2-digit'}) : 'Over a year', `hits ${$m(D.goal)}`)
    + fact($m(Math.round(t.flipCash + rate * wkTo(target(11, 25)))), 'by Christmas') + fact($m(Math.round(t.flipCash + rate * wkTo(target(3, 1)))), 'by 1 April');
}

/* items */

const inFilter = (i, f) => f === 'all' || i.status === f || (f === 'kept' && i.status === 'disputed');
function itemsView() {
  const all = allItems(), counts = { all: all.length, sold: C.sold.length, stock: C.stock.length, kept: C.kept.length + C.disputed.length };
  return `

      <input class="search" id="q" type="search" value="${esc(state.q)}" placeholder="Search tools, brands, notes" aria-label="Search items" autocomplete="off">
    </div>

}
function itemList() {
  const all = allItems(), ql = state.q.trim().toLowerCase();
  const rows = all.filter(i => inFilter(i, state.filter) && (!ql || `${i.name} ${vis(i).brand} ${i.note || ''}`.toLowerCase().includes(ql)));
  setTimeout(() => { const c = $('#icount'); if (c) c.textContent = `${rows.length} of ${all.length} items. Search, or tap a filter.`; });
  if (!rows.length) return `<div class="empty rise">Nothing matches${ql ? ` "${esc(state.q.trim())}"` : ''}</div>`;
  return rows.map((i, n) => {
    let main, sub, sub2, subCls, tag, cls;
    if (i.status === 'sold') { main = $m(i.sold); sub2 = $s(i.sold - i.cost); subCls = 'lime'; sub = [i.own ? 'Own' : 'Paid ' + $m(i.cost), 'wk ' + i.soldWeek, !i.own && sellTime(i, D) ? sellTime(i, D) : ''].filter(Boolean).join(' · '); tag = i.paid === false ? 'waiting' : 'sold'; cls = i.paid === false ? 'amber' : 'fill'; }
    else if (i.status === 'stock') { main = $m(i.list); sub2 = 'list'; subCls = 'mut'; sub = `${i.own ? 'Own' : 'Paid ' + $m(i.cost)} · ${stockState(i)}`; ({ tag, cls } = ageTag(i)); }
    else if (i.status === 'disputed') { main = $m(i.cost); sub2 = 'not counted'; subCls = 'mut'; sub = 'Refund in dispute'; tag = 'disputed'; cls = 'red'; }
    else { main = $m(i.cost); sub2 = 'not counted'; subCls = 'mut'; sub = i.boughtWeek ? 'Bought week ' + i.boughtWeek : 'Kept for me'; tag = 'kept'; cls = 'grey'; }
    return `<button class="rowp it" style="animation-delay:${delay(n)}ms" data-act="item" data-id="${esc(i.id)}">${icoTile(vis(i), 1)}
      <div class="grow"><div class="nm">${esc(i.name)}</div><div class="ir-meta">${chip(tag, cls)}<span class="sub ell">${sub}</span></div></div>
      <div class="ir-v"><div class="num">${main}</div><div class="${subCls}">${sub2}</div></div></button>`;
  }).join('');
}

/* deals: deals.json is rewritten every morning by the Trade Me check */
/* deals already seen on this phone are folded away; the list only changes when a new deals check lands */
function seenDeals() {
  let st = {};
  try { st = JSON.parse(localStorage.getItem('fl-seen-deals') || '{}') || {}; } catch {}
  const all = Array.isArray(st.seen) ? st.seen : [];
  if (st.viewing !== DEALS.updated) { st.base = all; st.viewing = DEALS.updated; }
  const base = new Set(Array.isArray(st.base) ? st.base : []);
  const now = DEALS.sections.flatMap(x => Array.isArray(x.items) ? x.items.map(i => i.url) : []).filter(Boolean);
  st.seen = [...new Set([...all, ...now])].slice(-2000);
  try { localStorage.setItem('fl-seen-deals', JSON.stringify(st)); } catch {}
  return base;
}
function dealsView() {
  const head = `<div class="ptitle"><h1 class="serif">Deals to <i>buy</i></h1><p>${DEALS && DEALS.updated ? 'Checked ' + esc(DEALS.updated) + '. ' : ''}Used, Auckland, Buy Now or offers.</p></div>`;
  if (!DEALS || !Array.isArray(DEALS.sections)) return head + '<div class="empty">No deals yet. The morning Trade Me check adds them at about 8:42am.</div>';
  const V = { good: ['good deal', 'green'], watch: ['watch', 'amber'], skip: ['skip', 'grey'] };
  let n = 0;
  const base = seenDeals(), first = base.size === 0;
  const row = it => {
      const v = vis({ name: String(it.title || '') }), [tag, cls] = V[it.verdict] || ['', 'grey'];
      const url = /^https:\/\/www\.trademe\.co\.nz\//.test(String(it.url || '')) ? it.url : '';
      const sub = [it.location, it.closes ? 'closes ' + it.closes : ''].filter(Boolean).join(' · '), note = [it.ptype, it.note].filter(Boolean).join('. ');
      const isNew = !first && !base.has(it.url);
      return `<a class="rowp deal it" style="animation-delay:${delay(n++)}ms"${url ? ` href="${esc(url)}" target="_blank" rel="noopener"` : ''}>${icoTile(v, 1)}
        <div class="grow"><div class="card-top"><div class="nm">${isNew ? '<span class="newtag">NEW</span>' : ''}${esc(it.title)}</div><div class="num p">${esc(it.price)}</div></div>
        <div class="card-mid">${tag ? chip(tag, cls) : ''}<span class="sub ell">${esc(sub)}</span></div>
        ${note ? `<div class="dnote">${esc(note)}</div>` : ''}</div></a>`;
  };
  return head + DEALS.sections.map(s => {
    const items = Array.isArray(s.items) ? s.items : [];
    const fresh = items.filter(it => !base.has(it.url)), old = items.filter(it => base.has(it.url));
    const rows = (fresh.length ? fresh.map(row).join('') : `<div class="empty">${esc(items.length ? 'Nothing new since you last looked.' : (s.empty || 'Nothing today'))}</div>`)
      + (old.length ? `<details class="seen"><summary>${old.length} already seen</summary>${old.map(row).join('')}</details>` : '');
    return `<div class="sh" style="margin-top:22px"><span class="num h">${esc(s.name)}</span><span class="k">${esc(s.rule || '')}</span></div>${rows}${s.footnote ? `<p class="dfoot">${esc(s.footnote)}</p>` : ''}`;
  }).join('');
}

/* ---------- item sheet ---------- */
function openSheet(id) {
  const i = D.items.find(x => x.id === id); if (!i) return;
  const v = vis(i), h = daysHeld(i, D);
  const lv = (k, val) => ({ k, v: $m(val), pp: $s(val - i.cost), ppCls: val - i.cost >= 0 ? 'lime' : 'red' });
  let rows;
  if (i.status === 'stock') rows = [lv('List at', i.list), lv('Accept down to', i.accept), lv('Worst case', i.worst)];
  else if (i.status === 'sold') rows = [{ k: 'Sold for', v: $m(i.sold) + unc(i, 'sold') }, { k: 'Profit', v: $s(i.sold - i.cost), vCls: 'lime' }, { k: 'Money in', v: i.paid === false ? 'Not yet' : 'Yes', vCls: i.paid === false ? 'red' : '' }];
  else rows = [{ k: 'Cost', v: $m(i.cost) }];
  const meta = [i.own ? 'My own' : i.cost ? 'Paid ' + $m(i.cost) + unc(i, 'cost') : '', i.boughtWeek ? 'week ' + i.boughtWeek : '', i.status === 'stock' ? stockState(i) : '', i.status === 'disputed' ? 'refund in dispute, not counted' : '',
    h && i.status === 'stock' ? `${h.approx ? 'about ' : ''}${h.n} days on the shelf` : i.status === 'sold' && !i.own && sellTime(i, D) ? 'sold in ' + sellTime(i, D) : ''].filter(Boolean).join(' · ');
  $('#sheet').innerHTML = `<div class="sw">
    <button class="dim" data-act="close" aria-label="Close"></button>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(i.name)}">
      <div class="sglow" style="background:radial-gradient(70% 90% at 50% 0%, ${tint(v.color, .32)}, transparent)"></div>
      <div class="grab"></div>
      <div class="sh-top">
        <span class="ico" style="background:${v.tileBg};color:${v.color}">${svgI(v.icon, 30)}</span>
        <div class="grow">${v.brand ? `<div class="sh-br" style="color:${v.color}">${v.brand}</div>` : ''}<div class="num sh-nm">${esc(i.name)}</div></div>
        <button class="x" data-act="close" aria-label="Close"><span>${svgI('M6 6l12 12M18 6L6 18', 14, 2.2)}</span></button>
      </div>
      ${meta ? `<div class="sh-meta">${meta}</div>` : ''}
      <div style="margin-top:10px">${rows.map((r, n) => `<div class="sr rise" style="animation-delay:${120 + n * 70}ms"><span class="kk">${r.k}</span><span class="num ${r.vCls || ''}">${r.v}</span><span class="pp ${r.ppCls || ''}">${r.pp || ''}</span></div>`).join('')}</div>
      ${i.note ? `<p class="sh-note">${esc(i.note)}</p>` : ''}
    </div></div>`;
  $('.sheet .x').focus({ preventScroll: true });
}
const closeSheet = () => { $('#sheet').innerHTML = ''; };

/* ---------- wiring ---------- */
function setTab(v) {
  if (v === state.tab) return;
  state.tab = v; showView();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'tab') setTab(a.dataset.tab);
  else if (act === 'item') openSheet(a.dataset.id);
  else if (act === 'close') closeSheet();
  else if (act === 'stage') { state.stage = a.dataset.stage; $$('#segs .seg').forEach(b => b.classList.toggle('on', b === a)); $('#stagelist').innerHTML = stageList(); }
  else if (act === 'week') { state.week = +a.dataset.wk; $$('#wkbars .wkb').forEach(b => b.classList.toggle('on', b === a)); $('#wkdetail').innerHTML = weekDetail(); }
  else if (act === 'filter') { state.filter = a.dataset.f; $$('#fps .fp').forEach(b => b.classList.toggle('on', b === a)); $('#ilist').innerHTML = itemList(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; $('#ilist').innerHTML = itemList(); }
  else if (e.target.id === 'rate') { state.rate = +e.target.value; drawChart(true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').innerHTML) closeSheet(); });
const rio = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' }) : null;
/* wrap each title word so it can rise out of its own mask */
function splitTitle() {
  const h = $('.view .ptitle h1'); if (!h || reduce) return;
  let k = 0;
  const wrap = node => [...node.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const f = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) return f.append(part);
        const w = document.createElement('span'); w.className = 'w';
        w.innerHTML = `<span style="--k:${k++}">${esc(part)}</span>`; f.append(w);
      });
      c.replaceWith(f);
    } else wrap(c);
  });
  wrap(h);
  h.closest('.ptitle').style.setProperty('--n', k);
}
function reveal() {
  if (reduce || !rio) return;
  $$('.view .sh, .view .rowp, .view .panel, .view .hl, .view .tile, .view .segs, .view .road, .view .road-l, .view .empty, .view .legend, .view .dfoot').forEach((el, k) => {
    if (el.closest('.reel, .say')) return;
    el.classList.add('rv'); el.style.transitionDelay = Math.min(240, (k % 6) * 40) + 'ms'; rio.observe(el);
  });
}
/* scroll engine: hero shrinks away, the flips reel swaps one tool per step, the statement lights word by word */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = el => { const r = el.getBoundingClientRect(); return clamp(-r.top / Math.max(1, r.height - innerHeight)); };
let reelCur = -1;
function onScroll() {
  const h = $('#hero'); if (!h) return;
  $('#bar').classList.toggle('show', (h.hidden ? $('.top').getBoundingClientRect().bottom : h.getBoundingClientRect().bottom) < 0);
  const p = prog(h), hin = $('#hin'), cue = $('#cue');
  if (hin && !reduce) { hin.style.transform = `translateY(${-p * 12}svh) scale(${1 - p * .3})`; hin.style.opacity = 1 - clamp((p - .45) / .55); }
  if (cue) cue.style.opacity = 1 - clamp(p / .12);
  const pt = $('.view .ptitle');
  if (pt && !reduce) { const y = Math.max(0, scrollY); pt.style.transform = `translateY(${-y * .18}px)`; pt.style.opacity = 1 - clamp(y / 420) * .65; }
  let amb = state.tab === 'stock' && C.stock.length ? vis(C.stock.slice().sort((a, b) => b.list - a.list)[0]).color : state.tab === 'items' ? cv('--mut') : cv('--lime');
  const reel = $('#reel');
  if (reel) {
    const flips = $$('#reel .flip'), n = Math.min(flips.length - 1, Math.floor(prog(reel) * flips.length * 1.0001));
    if (n !== reelCur) {
      reelCur = n;
      flips.forEach((el, k) => el.classList.toggle('on', k === n));
      $$('#rdots i').forEach((d, k) => d.classList.toggle('on', k === n));
      const it = D.items.find(x => x.id === flips[n].dataset.id), v = vis(it);
      $('#rglow').style.background = `radial-gradient(55% 45% at 50% 52%, ${tint(v.color, .5)}, ${tint(v.color, .12)} 55%, transparent 75%)`;
      $('#bword').textContent = (v.brand || 'Flip').toUpperCase();
      $('#rcount').textContent = `${n + 1} / ${flips.length}`;
    }
    const r = reel.getBoundingClientRect();
    if (r.top < innerHeight / 2 && r.bottom > innerHeight / 2) amb = vis(D.items.find(x => x.id === $$('#reel .flip')[reelCur].dataset.id)).color;
  }
  const say = $('#say');
  if (say) { const sp = prog(say); $$('#sayp span').forEach((w, k) => w.classList.toggle('lit', reduce || sp > .1 + k * .15)); $('#saysm').classList.toggle('lit', reduce || sp > .75); }
  const a = $('#amb'); a.style.setProperty('--amb1', tint(amb, .16)); a.style.setProperty('--amb2', tint(amb, .12));
}
let ticking = false;
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); } }, { passive: true });
addEventListener('resize', onScroll);

function countUp(el, to) {
  if (!el) return;
  if (reduce) return el.textContent = $m(to);
  const t0 = performance.now(), dur = 1500;
  setTimeout(() => el.textContent = $m(to), dur + 200);   // safety net if the tab is in the background
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = $m(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

fetch('data.json', {cache: 'no-store'}).then(r => { if (!r.ok) throw r.status; return r.json(); })
  .then(d => { D = d; C = calc(d); render(); })
  .catch(e => $('#app').innerHTML = `<div class="loading">Couldn't load data.json (${esc(e)}).</div>`);
fetch('deals.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null)
  .then(x => { DEALS = x; if (C && state.tab === 'deals') showView(); }).catch(() => {});
/* a home-screen app is rarely reloaded, so pick up new data and deals whenever it comes back into view */
let lastCheck = Date.now();
function refresh() {
  if (Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  fetch('data.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (d && JSON.stringify(d) !== JSON.stringify(D)) { D = d; C = calc(d); render(); }
  }).catch(() => {});
  fetch('deals.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(x => {
    if (x && JSON.stringify(x) !== JSON.stringify(DEALS)) { DEALS = x; if (C && state.tab === 'deals') showView(); }
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 10 * 60000);
})();
</script>
</body>
