<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip Ledger · Flow</title>
<meta name="theme-color" content="#08080C">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 60 / 30 / 10: midnight black, pure white, lime accent. Each scene is a tall block with a sticky stage that animates from scroll position. */
:root{
  --bg:#08080C; --ink:#F4F5F7; --mut:#9AA3AE; --line:#1E232A; --lime:#C6F432; --red:#FF7A6B;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --display:"Space Grotesk",Inter,system-ui,sans-serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.mut{color:var(--mut)}
.wrap{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px max(22px,env(safe-area-inset-left,0px));
  mix-blend-mode:difference;pointer-events:none}
.top b{font:700 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase}
.top a{pointer-events:auto;font:500 12px/1 var(--sans);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:8px 12px}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;--amb:#C6F432;background:radial-gradient(60% 40% at 0% 0%,color-mix(in srgb,var(--amb) 28%,transparent),transparent 70%),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--amb) 22%,transparent),transparent 70%);transition:--amb .6s}
main{position:relative;z-index:1}
.bar{position:fixed;left:0;top:0;height:2px;background:var(--lime);z-index:21;width:0}

/* scenes */
.scene{position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.glow{position:absolute;inset:-20%;pointer-events:none;transition:background .6s ease}

/* 1 hero */
#hero{height:220svh}
#hero .glow{background:radial-gradient(40% 35% at 50% 62%,rgba(198,244,50,.55),rgba(198,244,50,.08) 55%,transparent 75%)}
#hero .rays{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);mask-image:linear-gradient(to top,#000 10%,transparent 70%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 70%)}
.hero-in{position:relative;text-align:center;will-change:transform,opacity}
.hero-in .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hero-in .big{font-size:clamp(84px,30vw,220px);font-weight:700;line-height:.9;margin-top:10px}
.hero-in .big span{color:var(--lime)}
.hero-in .serif{font-size:clamp(30px,9vw,56px);line-height:1.05;margin-top:16px}
.hero-in .serif i{color:var(--lime)}
.cue{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.cue i{display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(var(--mut),transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.tiles{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;opacity:0;will-change:opacity,transform}
.tiles div{border:1px solid rgba(255,255,255,.12);background:rgba(10,12,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:12px;min-width:0}
.tiles .num{font-size:22px;font-weight:700;white-space:nowrap}
.tiles small{display:block;font-size:11px;color:var(--mut);margin-top:2px}

/* 2 flips: one product takes the screen per scroll step */
#flips .stage{place-items:stretch}
.brandword{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 clamp(110px,42vw,320px)/1 var(--display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.10);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.flip{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:calc(84px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(34px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));
  opacity:0;transform:translateY(40px) scale(.96);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.flip.on{opacity:1;transform:none}
.flip .brand{font:700 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase}
.flip h3{font-family:var(--serif);font-weight:400;font-size:clamp(34px,10vw,64px);line-height:1;margin-top:10px;max-width:14ch;text-wrap:balance}
.flip .icon{display:grid;place-items:center}
.flip .icon svg{width:min(56vw,300px);height:auto;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));transform:rotate(-8deg)}
.flip .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.flip .money{font-size:14px;color:var(--mut)}
.flip .money b{display:block;font:700 18px/1.2 var(--display);color:var(--ink);margin-top:2px}
.flip .profit{text-align:right}
.flip .profit .num{font-size:clamp(48px,15vw,92px);font-weight:700;line-height:.9}
.flip .profit small{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.dots{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
.dots i.on{background:#fff;height:18px;border-radius:99px}
.count{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));font:500 12px/1 var(--display);color:var(--mut);z-index:2}

/* 3 statement */
#say{height:200svh}
#say .stage{background:#F4F5F7;color:#08080C}
.say{font-family:var(--serif);font-size:clamp(46px,14vw,110px);line-height:1;text-align:center}
.say span{display:inline-block;opacity:.12;transition:opacity .35s}
.say span.lit{opacity:1}
.say em{color:#08080C;font-style:italic}
.say .lime{background:linear-gradient(transparent 62%,var(--lime) 62%)}
.say small{display:block;font:500 14px/1.4 var(--sans);color:#5B6670;margin-top:22px;opacity:0;transition:opacity .5s}
.say small.lit{opacity:1}

/* 4 shelf */
#shelf{padding-block:110px 40px}
.h2{font-family:var(--serif);font-size:clamp(40px,12vw,72px);line-height:1}
.h2 i{color:var(--lime)}
.lead{color:var(--mut);margin-top:10px;max-width:40ch}
.cards{display:grid;gap:14px;margin-top:28px}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:20px;background:#0E1014;opacity:0;transform:translateY(50px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.card.in{opacity:1;transform:none}
.card .cg{position:absolute;inset:auto -30% -70% -30%;height:120%;pointer-events:none;opacity:.5}
.card .row{position:relative;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .nm{font-size:17px;font-weight:600;line-height:1.25}
.card .st{font-size:12px;color:var(--mut);margin-top:4px}
.card .pp{font:700 30px/1 var(--display);white-space:nowrap}
.ladder{position:relative;display:grid;gap:8px;margin-top:18px}
.ladder div{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.ladder .t{height:6px;border-radius:99px;background:#1C2128;overflow:hidden}
.ladder .t b{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .2s}
.card.in .ladder .t b{width:var(--w)}
.ladder span:last-child{text-align:right;font:600 13px/1 var(--display);color:var(--ink)}

/* 5 goal */
#goal{height:240svh}
#goal .glow{background:radial-gradient(45% 40% at 50% 100%,rgba(198,244,50,.35),transparent 70%)}
.goal-in{position:relative;width:100%;text-align:center}
.goal-in .h2{max-width:12ch;margin:0 auto}
.road{position:relative;height:10px;border-radius:99px;background:#1C2128;margin:44px 0 14px;overflow:visible}
.road b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--lime);width:0;box-shadow:0 0 24px rgba(198,244,50,.6)}
.road em{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#08080C;border:3px solid var(--lime);transform:translate(-50%,-50%);left:0}
.road-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.goal-big{font-size:clamp(64px,22vw,150px);font-weight:700;line-height:.9;margin-top:34px}
.goal-big small{display:block;font:500 14px/1.4 var(--sans);color:var(--mut);margin-top:10px;letter-spacing:0}

/* end */
.end{padding-block:90px calc(70px + env(safe-area-inset-bottom,0px));text-align:center}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:16px 24px;border-radius:99px;background:var(--lime);color:#08080C;font-weight:600;text-decoration:none;min-height:44px}
.btn:focus-visible,.top a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fine{font-size:12px;color:#5B6670;margin-top:26px}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);z-index:30;background:var(--bg)}

@media (min-width:760px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flip .icon svg{width:320px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card{opacity:1;transform:none}.say span,.say small{opacity:1}
}
</style>
</head>
<body>
<div class="amb" id="amb"></div>
<div class="bar" id="bar"></div>
<header class="top"><b>Flip Ledger</b><a href="../">Full ledger</a></header>
<div class="loading" id="loading">Loading…</div>
<main id="main"></main>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Math.round(n).toLocaleString('en-NZ');
const $m = n => (n < 0 ? '−$' : '$') + num(Math.abs(n));
const $s = n => (n < 0 ? '−$' : '+$') + num(Math.abs(n));
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const ICON = {
  tablesaw: 'M3 13h18M6 13v6M18 13v6M8.5 13a3.5 3.5 0 0 1 7 0M12 9.5V7',
  planer: 'M4 9h16v9H4zM6 9l2-4h8l2 4M8 18v2M16 18v2M8 13.5h8',
  mower: 'M4 12h11l2-5h3M4.5 15a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M12.5 15a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0',
  drill: 'M3 9h11v6H3zM14 10h3l3 2-3 2h-3M6 15l-1 5h5l-1-5',
  cutoff: 'M7 10a5 5 0 1 0 10 0a5 5 0 1 0-10 0M3 20h18M7 20v-3h10v3',
  tyre: 'M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 4v5M12 15v5M4 12h5M15 12h5',
  box: 'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8'
};
const iconFor = n => /table saw/i.test(n) ? ICON.tablesaw : /planer/i.test(n) ? ICON.planer : /mower/i.test(n) ? ICON.mower : /drill/i.test(n) ? ICON.drill : /cut-off|mitre|drop saw/i.test(n) ? ICON.cutoff : /compressor|tyre/i.test(n) ? ICON.tyre : ICON.box;
const BRANDS = [[/dewalt/i,'DeWalt','#FFC933'],[/ryobi/i,'Ryobi','#C6E04A'],[/makita/i,'Makita','#2FC0BE'],[/bosch/i,'Bosch','#4D9BE8'],[/ozito/i,'Ozito','#FF5A57'],[/black\+decker/i,'Black+Decker','#FF8C42'],[/stanley/i,'Stanley','#FFD84D'],[/gearup/i,'GearUp','#96A0AC']];
const brandOf = n => { const b = BRANDS.find(x => x[0].test(n)); return b ? { name: b[1], color: b[2] } : { name: '', color: '#C6F432' }; };
const svg = (d, color) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const glowOf = c => `radial-gradient(55% 45% at 50% 55%, ${c}88, ${c}22 55%, transparent 75%)`;

function build(D) {
  const items = D.items, sold = items.filter(i => i.status === 'sold'), stock = items.filter(i => i.status === 'stock');
  const fuel = sum(D.trips, t => t.fuel);
  const cashIn = sum(sold.filter(i => i.paid !== false), i => i.sold);
  const flipCost = sum(items.filter(i => !i.own && (i.status === 'sold' || i.status === 'stock')), i => i.cost);
  const made = cashIn - flipCost - fuel;
  const profit = sum(sold, i => i.sold - i.cost) - fuel;
  const flips = sold.filter(i => !i.own).sort((a, b) => (a.soldWeek || 0) - (b.soldWeek || 0));
  const best = flips.slice().sort((a, b) => (b.sold - b.cost) - (a.sold - a.cost))[0];
  const goalPct = clamp(made / D.goal) * 100;

  $('#main').innerHTML = `
  <section class="scene" id="hero"><div class="stage">
    <div class="glow"></div><div class="rays"></div>
    <div class="hero-in wrap" id="heroIn">
      <div class="k">Money made so far</div>
      <div class="num big" id="bigv">$0</div>
      <div class="serif">Buy it cheap.<br><i>Sell it fast.</i></div>
    </div>
    <div class="tiles wrap" id="tiles">
      <div><span class="num">${$s(profit)}</span><small>profit on sales</small></div>
      <div><span class="num">${sold.length}</span><small>items sold</small></div>
      <div><span class="num">${stock.length}</span><small>on the shelf</small></div>
    </div>
    <div class="cue" id="cue">Scroll<i></i></div>
  </div></section>

  <section class="scene" id="flips" style="height:${(flips.length + 1) * 100}svh"><div class="stage">
    <div class="glow" id="fglow"></div>
    <div class="brandword" id="bword"></div>
    <div class="count" id="fcount"></div>
    <div class="dots" id="dots">${flips.map(() => '<i></i>').join('')}</div>
    ${flips.map((i, n) => { const b = brandOf(i.name), p = i.sold - i.cost; return `
      <article class="flip" data-n="${n}">
        <div><div class="brand" style="color:${b.color}">${esc(b.name || 'Flip ' + (n + 1))}</div><h3>${esc(i.name.replace(/\s*\(.*?\)/g, ''))}</h3></div>
        <div class="icon">${svg(iconFor(i.name), b.color)}</div>
        <div class="foot"><div class="money">Paid<b>${$m(i.cost)}</b><span style="display:block;margin-top:8px">Sold<b>${$m(i.sold)}</b></span></div>
          <div class="profit"><div class="num" style="color:${p >= 0 ? b.color : 'var(--red)'}">${$s(p)}</div><small>week ${i.soldWeek}${i === best ? ' · best flip' : ''}</small></div></div>
      </article>`; }).join('')}
  </div></section>

  <section class="scene" id="say"><div class="stage wrap">
    <p class="say" id="sayP"><span>Less</span> <span>rush.</span><br><span><em>More</em></span> <span class="lime">profit.</span>
      <small id="saySm">${flips.length} flips so far. Fast turnover beats big margins.</small></p>
  </div></section>

  <section id="shelf" class="wrap">
    <h2 class="h2">On the <i>shelf</i></h2>
    <p class="lead">${stock.length} item${stock.length === 1 ? '' : 's'}, ${$m(sum(stock, i => i.cost))} paid. List, accept, worst case.</p>
    <div class="cards">${stock.map(i => { const b = brandOf(i.name), max = Math.max(1, i.list); const st = i.collected === false ? 'Paid, to collect' : i.listed ? 'Listed' : 'At home, not listed';
      const rung = (k, v, c) => `<div><span>${k}</span><span class="t"><b style="--w:${clamp(v / max) * 100}%;background:${c}"></b></span><span>${$m(v)}</span></div>`;
      return `<article class="card"><div class="cg" style="background:radial-gradient(closest-side, ${b.color}55, transparent)"></div>
        <div class="row"><div><div class="nm">${esc(i.name)}</div><div class="st">${b.name ? `<span style="color:${b.color};font-weight:600">${b.name}</span> · ` : ''}${i.own ? 'Own' : 'Paid ' + $m(i.cost)} · ${st}</div></div><div class="pp">${$m(i.list)}</div></div>
        <div class="ladder">${rung('List', i.list, b.color)}${rung('Accept', i.accept, b.color + 'AA')}${rung('Worst', i.worst, '#5B6670')}</div></article>`; }).join('') || '<p class="mut">Nothing on the shelf.</p>'}</div>
  </section>

  <section class="scene" id="goal"><div class="stage wrap">
    <div class="glow"></div>
    <div class="goal-in">
      <h2 class="h2">The road to the <i>car</i></h2>
      <div class="road"><b id="roadB"></b><em id="roadE"></em></div>
      <div class="road-l"><span>$0</span><span>${$m(D.goal)} goal</span></div>
      <div class="num goal-big" id="goalV">0%<small></small></div>
    </div>
  </div></section>

  <section class="end wrap">
    <p class="serif h2">Every number, <i>live.</i></p>
    <a class="btn" href="../">Open the full ledger →</a>
    <p class="fine">Preview only. Updated ${esc(D.updated)}.</p>
  </section>`;

  /* scroll engine */
  const hero = $('#hero'), heroIn = $('#heroIn'), tiles = $('#tiles'), cue = $('#cue');
  const flipSec = $('#flips'), flipEls = $$('.flip'), dots = $$('#dots i'), fglow = $('#fglow'), bword = $('#bword'), fcount = $('#fcount');
  const say = $('#say'), words = $$('#sayP span'), saySm = $('#saySm');
  const goal = $('#goal'), roadB = $('#roadB'), roadE = $('#roadE'), goalV = $('#goalV');
  const prog = el => { const r = el.getBoundingClientRect(); return clamp(-r.top / Math.max(1, r.height - innerHeight)); };
  let cur = -1, counted = false;

  function frame() {
    const h = document.documentElement;
    $('#bar').style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';

    const p = prog(hero);
    heroIn.style.transform = `translateY(${-p * 18}svh) scale(${1 - p * .35})`;
    heroIn.style.opacity = 1 - clamp((p - .55) / .45);
    tiles.style.opacity = clamp((p - .15) / .3) * (1 - clamp((p - .8) / .2));
    tiles.style.transform = `translateY(${(1 - clamp((p - .15) / .3)) * 30}px)`;
    cue.style.opacity = 1 - clamp(p / .1);

    const fp = prog(flipSec), n = Math.min(flipEls.length - 1, Math.floor(fp * flipEls.length * 1.0001));
    if (n !== cur && flipEls.length) {
      cur = n;
      flipEls.forEach((el, k) => el.classList.toggle('on', k === n));
      dots.forEach((d, k) => d.classList.toggle('on', k === n));
      const b = brandOf(flips[n].name);
      fglow.style.background = glowOf(b.color);
      bword.textContent = (b.name || 'FLIP').toUpperCase();
      fcount.textContent = `${n + 1} / ${flips.length}`;
    }
    const r = flipSec.getBoundingClientRect(), inFlips = r.top < innerHeight / 2 && r.bottom > innerHeight / 2;
    $('#amb').style.setProperty('--amb', inFlips && cur >= 0 ? brandOf(flips[cur].name).color : '#C6F432');

    const sp = prog(say);
    words.forEach((w, k) => w.classList.toggle('lit', sp > .1 + k * .15));
    saySm.classList.toggle('lit', sp > .75);

    const gp = clamp(prog(goal) / .7), shown = made * gp, pct = clamp(shown / D.goal) * 100;
    roadB.style.width = pct + '%'; roadE.style.left = pct + '%';
    goalV.firstChild.textContent = Math.round(pct) + '%';
    goalV.querySelector('small').textContent = `${$m(Math.round(shown))} of ${$m(D.goal)} · ${$m(Math.max(0, D.goal - made))} to go`;
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; frame(); }); } }, { passive: true });
  addEventListener('resize', frame);
  frame();

  /* hero count-up */
  const big = $('#bigv');
  if (reduce) big.textContent = $m(made);
  else { const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / 1600), e = 1 - Math.pow(1 - k, 4); big.textContent = $m(made * e); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); setTimeout(() => big.textContent = $m(made), 1800); }

  /* shelf cards rise in */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .2 });
  $$('.card').forEach(c => io.observe(c));
  $('#loading').remove();
}

fetch('../data.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw r.status; return r.json(); })
  .then(build).catch(e => $('#loading').textContent = `Couldn't load data.json (${e}).`);
})();
</script>
</body>
